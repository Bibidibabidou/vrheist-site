<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR Heist — 3D Graybox Floor Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--panel:rgba(21,25,34,.92);--line:#2a3142;--text:#e7e9ee;--muted:#9aa3b5;--gold:#e8b04a;--cyan:#4fc3f7;--red:#ff3b4f;--violet:#b388ff;--green:#59d98e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1a2030 0%,#0d0f14 70%);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}
#stage{position:fixed;inset:0}
#labels{position:fixed;inset:0;pointer-events:none}
#ui{position:fixed;top:14px;left:14px;width:300px;max-height:calc(100% - 28px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;backdrop-filter:blur(6px)}
#ui h1{font-size:1.15rem;margin:0 0 2px}
.kicker{font-family:'IBM Plex Mono',monospace;color:var(--red);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase}
.sec{margin-top:14px}
.sec>label,.sec .lab{display:block;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font-family:'IBM Plex Mono',monospace;font-size:.78rem;background:#1b2030;color:var(--text);border:1px solid var(--line);padding:6px 9px;border-radius:6px;cursor:pointer}
button:hover{border-color:#556}
button.on{background:#2a3350;border-color:var(--gold);color:#fff}
input[type=range]{width:100%;accent-color:var(--gold)}
.tog{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin:5px 0;cursor:pointer}
.tog input{accent-color:var(--gold)}
#goal{font-size:.85rem;color:var(--muted);line-height:1.45}
#goal b{color:var(--text)}
#keylist{list-style:none;margin:0;padding:0}
#keylist li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:.84rem;cursor:pointer;border-bottom:1px dashed var(--line)}
#keylist li:hover{color:#fff}
.dot{flex:0 0 20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 .68rem 'IBM Plex Mono',monospace;color:#0d0f14}
#info{position:fixed;right:14px;bottom:14px;width:340px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:none}
#info .x{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--muted);font-size:1rem}
#info h3{margin:4px 0 6px;font-size:1rem;display:flex;gap:8px;align-items:center}
#info p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.5}
#info .fl{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--muted)}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:20px;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
/* 3D labels */
.pin{pointer-events:auto;cursor:pointer;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 11px 'IBM Plex Mono',monospace;color:#0d0f14;border:2px solid #0d0f14;box-shadow:0 0 0 1px rgba(255,255,255,.35),0 2px 8px rgba(0,0,0,.5);transition:transform .12s}
.pin:hover{transform:scale(1.25)}
.pin.sel{outline:2px solid #fff;outline-offset:2px}
.flabel{font:700 13px 'Space Grotesk',sans-serif;padding:3px 9px;border-radius:5px;background:rgba(13,15,20,.85);border:1px solid;white-space:nowrap;pointer-events:auto;cursor:pointer}
.zlabel{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#d6dbe6;background:rgba(13,15,20,.6);padding:1px 5px;border-radius:3px;white-space:nowrap}
.vlabel{font:500 9px 'IBM Plex Mono',monospace;color:#7fdfff;background:rgba(13,15,20,.6);padding:1px 5px;border-radius:3px;white-space:nowrap}
@media (max-width:760px){#ui{width:calc(100% - 28px);max-height:42%}#info{left:14px;width:auto}#hint{display:none}}
</style>

</script>

<body>
<div id="stage"></div>
<div id="labels"></div>

<div id="ui">

  <h1>Five floors, one 6 × 6 m room</h1>
  <div class="sec">
    <span class="lab">View</span>
    <div class="btns" id="viewBtns"></div>
  </div>
  <div class="sec">
    <label for="explode">Explode floors</label>
    <input type="range" id="explode" min="0" max="1" step="0.01" value="0.45">
  </div>
  <div class="sec">
    <span class="lab">Camera</span>
    <div class="btns">

  </div>
  <div class="sec">
    <span class="lab">Show</span>
    <label class="tog"><input type="checkbox" id="tPins" checked> Numbered elements</label>
    <label class="tog"><input type="checkbox" id="tZones" checked> Zone &amp; view labels</label>
    <label class="tog"><input type="checkbox" id="tPaths" checked> Player routes &amp; co-op links</label>
    <label class="tog"><input type="checkbox" id="tWalls"> Full-height outer walls</label>
    <label class="tog"><input type="checkbox" id="tPeople" checked> 1.75 m player for scale</label>
    <label class="tog"><input type="checkbox" id="tAnim" checked> Animate lasers &amp; lights</label>
  </div>
  <div class="sec">
    <div class="legend"><span><i style="background:#e8b04a"></i>Interaction</span><span><i style="background:#4fc3f7"></i>Co-op</span><span><i style="background:#ff3b4f"></i>Hazard</span><span><i style="background:#b388ff"></i>Story</span><span><i style="background:#59d98e"></i>Lift</span></div>
  </div>
  <div class="sec" id="floorInfo" style="display:none">
    <span class="lab" id="floorTag"></span>
    <div id="goal"></div>
    <ul id="keylist" style="margin-top:8px"></ul>
  </div>
</div>

<div id="info"><button class="x" id="infoX" aria-label="Close">✕</button><div class="fl" id="infoFloor"></div><h3 id="infoT"></h3><p id="infoD"></p></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const CAT = {int:'#e8b04a', coop:'#4fc3f7', haz:'#ff3b4f', story:'#b388ff'};
const ACCENT = {b1:'#4fc3f7', g:'#ff3b4f', f1:'#e8b04a', f2:'#b388ff', roof:'#59d98e'};
const SHORT = {b1:'B1', g:'G', f1:'1', f2:'2', roof:'R'};
const H = 2.8;               // storey height of walls

// ---------- renderer / scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer({element:document.getElementById('labels')});
labelRenderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d0f14, 40, 90);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.05, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI*0.98;

scene.add(new THREE.HemisphereLight(0xdfe7ff, 0x1a1d24, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(10, 30, 14); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:80});
scene.add(sun); scene.add(sun.target);

// ---------- materials ----------
const M = {
  slab: new THREE.MeshStandardMaterial({color:0x6c717b, roughness:.95}),
  slabSide: new THREE.MeshStandardMaterial({color:0x3b404a, roughness:1}),
  wall: new THREE.MeshStandardMaterial({color:0xb7bcc6, roughness:.9}),
  wallGhost: new THREE.MeshStandardMaterial({color:0xaeb4c0, roughness:.9, transparent:true, opacity:.18, depthWrite:false, side:THREE.DoubleSide}),
  obj: new THREE.MeshStandardMaterial({color:0x9aa0ab, roughness:.85}),
  glass: new THREE.MeshStandardMaterial({color:0xbfe9ff, roughness:.1, transparent:true, opacity:.28, depthWrite:false}),
  anchor: new THREE.MeshStandardMaterial({color:0xb8913f, roughness:.6, metalness:.2}),
  laser: new THREE.MeshBasicMaterial({color:0xff2440}),
  laserGlow: new THREE.MeshBasicMaterial({color:0xff2440, transparent:true, opacity:.22, depthWrite:false}),
  sweep: new THREE.MeshBasicMaterial({color:0xff2440, transparent:true, opacity:.28, side:THREE.DoubleSide, depthWrite:false}),
  vista: new THREE.MeshBasicMaterial({color:0x7fdfff, transparent:true, opacity:.22, side:THREE.DoubleSide, depthWrite:false}),
  door: new THREE.MeshStandardMaterial({color:0xff9a3c, roughness:.6, emissive:0x40200a}),
  lift: new THREE.MeshStandardMaterial({color:0x59d98e, roughness:.4, transparent:true, opacity:.22, depthWrite:false, side:THREE.DoubleSide}),
  liftFrame: new THREE.MeshStandardMaterial({color:0x59d98e, emissive:0x1d5a35, roughness:.4}),
  person: new THREE.MeshStandardMaterial({color:0x8fb3ff, roughness:.6}),
  cutter: new THREE.MeshBasicMaterial({color:0xffffff}),
};

// ---------- helpers ----------
const W = v => v - 3;   // plan metres -> world (centred)
function parseColor(str){
  const m = str.match(/rgba?\(([^)]+)\)/);
  if(!m) return {c:new THREE.Color(str), a:1};
  const p = m[1].split(',').map(Number);
  return {c:new THREE.Color(p[0]/255,p[1]/255,p[2]/255), a:p[3]===undefined?1:p[3]};
}
function box(g, x, y, w, d, y0, h, mat, shadow=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w,.01), Math.max(h,.01), Math.max(d,.01)), mat);
  m.position.set(W(x+w/2), y0+h/2, W(y+d/2));
  m.castShadow = shadow; m.receiveShadow = true;
  g.add(m); return m;
}
function beam(g, x1, y1, x2, y2, h, r=.012){
  const a = new THREE.Vector3(W(x1),h,W(y1)), b = new THREE.Vector3(W(x2),h,W(y2));
  const len = a.distanceTo(b), mid = a.clone().add(b).multiplyScalar(.5);
  const grp = new THREE.Group();
  const core = new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8), M.laser);
  const glow = new THREE.Mesh(new THREE.CylinderGeometry(r*4,r*4,len,10), M.laserGlow);
  grp.add(core, glow);
  grp.position.copy(mid);
  grp.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), b.clone().sub(a).normalize());
  g.add(grp); return grp;
}
function flatShape(g, pts, color, opacity, y=.02){
  const s = new THREE.Shape(pts.map(p=>new THREE.Vector2(W(p[0]), -W(p[1]))));
  const mesh = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshBasicMaterial({color, transparent:true, opacity, depthWrite:false, side:THREE.DoubleSide}));
  mesh.rotation.x = -Math.PI/2; mesh.position.y = y; g.add(mesh); return mesh;
}
function dashed(g, pts, color, dash, gap, y, opacity=.9){
  const geo = new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(W(p[0]), p[2]!==undefined?p[2]:y, W(p[1]))));
  const line = new THREE.Line(geo, new THREE.LineDashedMaterial({color, dashSize:dash, gapSize:gap, transparent:true, opacity}));
  line.computeLineDistances(); g.add(line); return line;
}
function label(g, cls, html, x, h, y, color){
  const el = document.createElement('div'); el.className = cls; el.innerHTML = html;
  if(color){ el.style.borderColor = color; el.style.color = color; }
  const o = new CSS2DObject(el); o.position.set(W(x), h, W(y)); g.add(o); return o;
}
function arrowHead(g, from, to, color, y){
  const dir = new THREE.Vector3(W(to[0])-W(from[0]),0,W(to[1])-W(from[1])).normalize();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(.07,.2,10), new THREE.MeshBasicMaterial({color}));
  cone.position.set(W(to[0]), y, W(to[1]));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  g.add(cone);
}
function person(g, x, y, color=M.person){
  const p = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.2,1.05,4,12), color);
  body.position.y = .2+1.05/2; body.castShadow = true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(.13,16,12), color);
  head.position.y = 1.62; head.castShadow = true;
  const visor = new THREE.Mesh(new THREE.BoxGeometry(.2,.08,.1), new THREE.MeshStandardMaterial({color:0x111111}));
  visor.position.set(0,1.64,.11);
  p.add(body, head, visor);
  p.position.set(W(x), 0, W(y));
  g.add(p); return p;
}

// ---------- build floors ----------
const floorRecs = [];
const anim = { sweeps:[], cones:[], pulses:[] };

floors.forEach((f, idx)=>{
  const g = new THREE.Group(); g.name = f.id;
  const layers = { pins:new THREE.Group(), zones:new THREE.Group(), paths:new THREE.Group(), tallWalls:new THREE.Group(), lowWalls:new THREE.Group(), people:new THREE.Group() };
  Object.values(layers).forEach(l=>g.add(l));
  const accent = new THREE.Color(ACCENT[f.id]);
  const isRoof = f.id==='roof';

  // slab
  const slab = new THREE.Mesh(new THREE.BoxGeometry(6.0, .16, 6.0), [M.slabSide,M.slabSide,M.slab,M.slabSide,M.slabSide,M.slabSide]);
  slab.position.y = -.08; slab.receiveShadow = true; g.add(slab);
  // accent rim
  const rim = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(6.02,.17,6.02)), new THREE.LineBasicMaterial({color:accent}));
  rim.position.y = -.08; g.add(rim);
  // 1 m grid
  const gpts=[]; for(let i=1;i<6;i++){ gpts.push(W(i),.005,W(0), W(i),.005,W(6), W(0),.005,W(i), W(6),.005,W(i)); }
  const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.Float32BufferAttribute(gpts,3));
  g.add(new THREE.LineSegments(gg, new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:.10})));
  // safety margin
  dashed(g, [[.4,.4],[5.6,.4],[5.6,5.6],[.4,5.6],[.4,.4]], 0xffffff, .12, .16, .012, .35);

  // outer walls: low curb + tall ghost (or 1 m parapet on roof)
  const wallH = isRoof ? 1.0 : H, t=.08;
  [[0,-t,6,t],[0,6,6,t],[-t,0,t,6],[6,0,t,6]].forEach(r=>{
    box(layers.lowWalls, r[0],r[1],r[2],r[3], 0, isRoof?1.0:.25, isRoof?M.wall:M.wall);
    if(!isRoof) box(layers.tallWalls, r[0],r[1],r[2],r[3], 0, wallH, M.wallGhost, false);
  });

  // zones (floor decals)
  (f.zones||[]).forEach(z=>{
    const {c,a} = parseColor(z.fill);
    flatShape(g, [[z.x,z.y],[z.x+z.w,z.y],[z.x+z.w,z.y+z.h],[z.x,z.y+z.h]], c, Math.min(.55,a*3.2), .015);
    if(z.stroke) dashed(g, [[z.x,z.y],[z.x+z.w,z.y],[z.x+z.w,z.y+z.h],[z.x,z.y+z.h],[z.x,z.y]], new THREE.Color(z.stroke), .1,.08,.02,.8);
    if(z.label){
      const glass = /GLASS/.test(z.label);
      if(glass) box(g, z.x, z.y, z.w, z.h, 0, .03, M.glass, false);
      label(layers.zones,'zlabel', z.label.replace(' →',''), z.x+z.w/2, .08, z.y+z.h/2);
    }
  });
  // hatch (laser zones) -> faint red floor
  (f.hatch||[]).forEach(z=> flatShape(g, [[z.x,z.y],[z.x+z.w,z.y],[z.x+z.w,z.y+z.h],[z.x,z.y+z.h]], 0xff3b4f, .12, .013));
  // light cones
  (f.polys||[]).forEach(p=>{
    const red = /search/.test(p.label||'');
    const m = flatShape(g, p.pts, red?0xff3b4f:0xfff1b0, red?.22:.20, .025);
    anim.cones.push({mesh:m, base:red?.22:.20, speed:red?1.3:.8, idx});
    if(p.label) label(layers.zones,'zlabel', p.label, p.lx, .1, p.ly);
  });

  // walls
  (f.walls||[]).forEach(w=>{
    const crate = /crate/.test(w.label||'');
    box(g, w.x, w.y, w.w, w.h, 0, crate?1.9:H*.86, crate?M.obj:M.wall);
    if(crate) for(let k=0;k<3;k++) box(g, w.x-.02, w.y+.1+k*.85, w.w+.04, .7, 1.9, .35+((k%2)*.25), M.obj);
  });

  // glass windows: low wall + glass + lintel, matching partition height
  (f.windows||[]).forEach(w=>{
    const top = H*.86;
    box(g, w.x, w.y, w.w, w.h, 0, .9, M.wall);
    box(g, w.x+.02, w.y+.02, Math.max(w.w-.04,.04), Math.max(w.h-.04,.04), .9, top-.9-.12, M.glass, false);
    box(g, w.x, w.y, w.w, w.h, top-.12, .12, M.wall);
  });
  // spot-lit sculpture court on G
  if(f.id==='g'){
    const spot = new THREE.SpotLight(0xffe2a8, 18, 6, Math.PI/5, .5, 1.5);
    spot.position.set(W(1.8), 2.6, W(1.8)); spot.target.position.set(W(1.8), 0, W(1.8));
    g.add(spot, spot.target);
    const halo = new THREE.Mesh(new THREE.CircleGeometry(.9,40), new THREE.MeshBasicMaterial({color:0xffe2a8, transparent:true, opacity:.18, depthWrite:false}));
    halo.rotation.x = -Math.PI/2; halo.position.set(W(1.8), .02, W(1.8)); g.add(halo);
    label(layers.zones,'zlabel','SCULPTURE COURT', 2.4, .1, 3.3);
  }
  // objects
  (f.objs||[]).forEach(o=>{
    const lbl = o.label||'';
    let y0=0, h=1.0;
    if(o.h<=.16 || o.w<=.16){ y0=1.15; h=.85; }             // wall-hung painting
    else if(/AC/.test(lbl)) h=1.2;
    else if(/vent/.test(lbl)) h=.8;
    else if(o.w<=.4 && o.h>=1.5) h=2.0;                     // deposit box wall
    else if(o.w<=.45 && o.h<=.65) { y0=.8; h=.8; }          // fuse box on console
    const mesh = box(g, o.x, o.y, o.w, o.h, y0, h, M.obj);
    if(/^(W\d|S\d|coins)$/.test(lbl)){
      mesh.scale.y = .9/h; mesh.position.y = .45;
      box(g, o.x+.03, o.y+.03, o.w-.06, o.h-.06, .9, .4, M.glass, false);
    }
    if(lbl) label(layers.zones,'zlabel', lbl, o.x+o.w/2, (y0+h)+.15, o.y+o.h/2);
  });

  // anchor plinth
  if(f.anchor){
    box(g, 1.5,1.5,.6,.6, 0, .9, M.anchor);
    if(f.id==='f1'||f.id==='f2') box(g, 1.55,1.55,.5,.5, .9, .45, M.glass, false);
    if(f.id==='g'){ const s = new THREE.Mesh(new THREE.TorusKnotGeometry(.16,.05,80,10), M.anchor); s.position.set(W(1.8),1.2,W(1.8)); s.castShadow=true; g.add(s); anim.pulses.push({mesh:s, spin:true}); }
    if(typeof f.anchor==='string') label(layers.zones,'zlabel', f.anchor, 1.8, 1.55, 1.8);
  }

  // vistas (view-only panels on the boundary)
  (f.vistas||[]).forEach(v=>{
    const vh = isRoof?1.0:H, off=.12;
    const horiz = v.y1===v.y2;
    const len = horiz?Math.abs(v.x2-v.x1):Math.abs(v.y2-v.y1);
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(len, vh), M.vista);
    const outY = v.y1<=0 ? -off : v.y1>=6 ? off : 0;
    const outX = v.x1<=0 ? -off : v.x1>=6 ? off : 0;
    if(horiz){ plane.position.set(W((v.x1+v.x2)/2), vh/2+.02, W(v.y1)+outY); }
    else { plane.position.set(W(v.x1)+outX, vh/2+.02, W((v.y1+v.y2)/2)); plane.rotation.y = Math.PI/2; }
    g.add(plane);
    if(v.label){
      const lx = horiz?(v.x1+v.x2)/2 : v.x1 + (outX<0?-.35:.35);
      const ly = horiz? v.y1 + (outY<0?-.35:.35) : (v.y1+v.y2)/2;
      label(layers.zones,'vlabel', v.label, lx, vh+.25, ly);
    }
  });

  // doors (vault door / stairwell)
  (f.doors||[]).forEach(d=>{
    const vertical = d.x1===d.x2;
    if(vertical) box(g, d.x1-.07, d.y1, .14, d.y2-d.y1, 0, 2.2, M.door);
    else box(g, d.x1, d.y1-.07, d.x2-d.x1, .14, 0, 2.2, M.door);
    if(/vault/.test(d.label||'')){
      const ring = new THREE.Mesh(new THREE.TorusGeometry(.62,.07,12,40), M.door);
      ring.position.set(W(d.x1)+.1, 1.15, W((d.y1+d.y2)/2)); ring.rotation.y = Math.PI/2; g.add(ring);
    }
    if(d.label) label(layers.zones,'zlabel', d.label, vertical?d.x1+(d.x1>=6?.35:-.4):(d.x1+d.x2)/2, 2.45, vertical?(d.y1+d.y2)/2:d.y1);
  });

  // lasers
  (f.lasers||[]).forEach(l=>{
    if(l.type==='low'){ [.12,.22,.32].forEach(h=>beam(g,l.x1,l.y1,l.x2,l.y2,h)); }
    else if(l.type==='high'){ [1.0,1.2].forEach(h=>beam(g,l.x1,l.y1,l.x2,l.y2,h)); }
    else if(l.type==='grid'){ for(let h=.2;h<=1.95;h+=.25) beam(g,l.x1,l.y1,l.x2,l.y2,h,.009); }
    else if(l.type==='sweep'){
      const len = Math.abs(l.y2-l.y1);
      const sw = (f.sweeps||[])[0] || {x1:l.x1-.5,x2:l.x1+.5};
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(len, 2.1), M.sweep);
      plane.rotation.y = Math.PI/2; plane.position.set(W(l.x1), 1.05, W((l.y1+l.y2)/2));
      g.add(plane);
      const edge = beam(g, l.x1, l.y1, l.x1, l.y2, 2.1, .015);
      anim.sweeps.push({items:[plane,edge], a:W(sw.x1), b:W(sw.x2), idx});
    }
    if(l.label) label(layers.zones,'zlabel', l.label, l.lx, .55, l.ly);
  });

  // spawn rings
  (f.spawns||[]).forEach((s,i)=>{
    const ring = new THREE.Mesh(new THREE.RingGeometry(.18,.24,32), new THREE.MeshBasicMaterial({color:0x4fc3f7, side:THREE.DoubleSide}));
    ring.rotation.x = -Math.PI/2; ring.position.set(W(s[0]),.02,W(s[1])); g.add(ring);
    label(layers.zones,'zlabel', 'P'+(i+1), s[0], .1, s[1]);
  });

  // routes and co-op links
  (f.paths||[]).forEach(p=>{
    const col = p.alt?0x4fc3f7:0xffffff;
    dashed(layers.paths, p.pts, col, p.alt?.18:.06, p.alt?.12:.12, .05, .95);
    arrowHead(layers.paths, p.pts[p.pts.length-2], p.pts[p.pts.length-1], col, .05);
  });
  (f.links||[]).forEach(l=>{
    dashed(layers.paths, [[l[0],l[1],1.3],[l[2],l[3],1.3]], 0x4fc3f7, .06, .1, 1.3, .9);
    if(l[4]) label(layers.zones,'vlabel', l[4], (l[0]+l[2])/2, 1.5, (l[1]+l[3])/2);
  });

  // lift car (NE 2x2, door on south face x 4.4-5.6)
  const lift = new THREE.Group(); g.add(lift);
  box(lift, 4.0, 0, .05, 2.0, 0, 2.6, M.lift, false);           // west wall
  box(lift, 4.0, 0, 2.0, .05, 0, 2.6, M.lift, false);           // north wall (glass so you can see inside)
  box(lift, 5.95,0, .05, 2.0, 0, 2.6, M.lift, false);           // east wall
  box(lift, 4.0, 1.95, .4, .05, 0, 2.6, M.lift, false);         // south wall left of door
  box(lift, 5.6, 1.95, .4, .05, 0, 2.6, M.lift, false);         // south wall right of door
  box(lift, 4.4, 1.95, 1.2, .05, 2.2, .4, M.lift, false);       // lintel
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2,2.6,2)), new THREE.LineBasicMaterial({color:0x59d98e}));
  edges.position.set(W(5),1.3,W(1)); lift.add(edges);
  box(lift, 4.38, 1.9, .06, .14, 0, 2.2, M.liftFrame); box(lift, 5.56, 1.9, .06, .14, 0, 2.2, M.liftFrame);
  box(lift, 5.86, .75, .08, .5, 1.0, .5, M.liftFrame);          // floor panel
  if(!isRoof) box(lift, 4.0, 0, 2.0, 2.0, 2.6, .05, M.lift, false);
  label(layers.zones,'zlabel', 'LIFT' + (f.liftNote?' · '+f.liftNote:''), 5, 2.85, 1);

  // people for scale
  if(f.id==='b1'){ person(layers.people, 0.8, 4.4); person(layers.people, 1.8, 4.4, new THREE.MeshStandardMaterial({color:0xffb3c7, roughness:.6})); }
  else if(f.id==='g'){ person(layers.people, 4.6, 4.9); }
  else if(f.id==='f1'){ person(layers.people, 2.6, 4.9); person(layers.people, 3.5, 4.9, new THREE.MeshStandardMaterial({color:0xffb3c7, roughness:.6})); }
  else if(f.id==='f2'){ person(layers.people, 3.95, 2.6); }
  else if(f.id==='roof'){ person(layers.people, 5.45, 3.55); }

  // numbered pins
  const pins=[];
  (f.keys||[]).forEach((k,i)=>{
    const col = CAT[k.c];
    const ph = 2.05;
    const stem = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(W(k.x),.02,W(k.y)), new THREE.Vector3(W(k.x),ph-.12,W(k.y))]), new THREE.LineBasicMaterial({color:col, transparent:true, opacity:.75}));
    layers.pins.add(stem);
    const dot = new THREE.Mesh(new THREE.CircleGeometry(.12,20), new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:.55}));
    dot.rotation.x=-Math.PI/2; dot.position.set(W(k.x),.03,W(k.y)); layers.pins.add(dot);
    const el = document.createElement('div'); el.className='pin'; el.style.background=col; el.textContent=i+1;
    el.title = k.t;
    el.addEventListener('click', ev=>{ ev.stopPropagation(); showInfo(idx,i); });
    const o = new CSS2DObject(el); o.position.set(W(k.x), ph, W(k.y)); layers.pins.add(o);
    pins.push(el);
  });

  // floor title
  const ft = label(g,'flabel', `${SHORT[f.id]} · ${f.name.split('·')[1].trim()}`, -0.35, .2, 6.45, ACCENT[f.id]);
  ft.element.addEventListener('click', ()=>setView(idx));

  scene.add(g);
  floorRecs.push({f, g, layers, pins});
});

// lift shaft through the stack
const shaft = new THREE.Mesh(new THREE.BoxGeometry(2.04, 1, 2.04), new THREE.MeshBasicMaterial({color:0x59d98e, transparent:true, opacity:.06, depthWrite:false}));
const shaftEdges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2.04,1,2.04)), new THREE.LineDashedMaterial({color:0x59d98e, dashSize:.2, gapSize:.15}));
scene.add(shaft, shaftEdges);

// ---------- state / layout ----------
let view = -1;            // -1 = all floors
let spacing = 0;
const targetPos = new THREE.Vector3(), targetLook = new THREE.Vector3();
let camAnim = 0;

function spacingFromSlider(){ const v = +document.getElementById('explode').value; return 3.0 + v*7.0; }
function layout(){
  spacing = spacingFromSlider();
  floorRecs.forEach((r,i)=>{
    r.g.position.y = i*spacing;
    r.g.visible = (view===-1 || view===i);
  });
  const top = (floorRecs.length-1)*spacing + 2.6;
  shaft.scale.y = top; shaft.position.set(W(5), top/2, W(1));
  shaftEdges.scale.y = top; shaftEdges.position.copy(shaft.position); shaftEdges.computeLineDistances();
  shaft.visible = shaftEdges.visible = (view===-1);
}
function stackCenterY(){ return view===-1 ? ((floorRecs.length-1)*spacing)/2 + 1 : view*spacing + 1; }

function camPreset(kind){
  const cy = stackCenterY();
  const single = view!==-1;
  const fov = camera.fov*Math.PI/180;
  const stackH = 4*spacing + 6;
  const d = single ? 11 : Math.max(16, (stackH/2)/Math.tan(fov/2)*1.2);
  const look = new THREE.Vector3(0, cy, 0);
  let pos;
  if(kind==='top') pos = new THREE.Vector3(0, cy + (single?12:d*1.1), 0.25);
  else if(kind==='front') pos = new THREE.Vector3(0, cy + (single?3:2), d);
  else if(kind==='side') pos = new THREE.Vector3(d, cy + (single?3:2), 0);
  else if(kind==='player'){
    const fy = (single?view:0)*spacing;
    pos = new THREE.Vector3(W(5), fy+1.65, W(2.4)); look.set(W(0.6), fy+1.0, W(3.0));
  }
  else pos = new THREE.Vector3(.62, .42, .78).normalize().multiplyScalar(d).add(new THREE.Vector3(0,cy,0));
  targetPos.copy(pos); targetLook.copy(look); camAnim = 1;
  document.querySelectorAll('[data-cam]').forEach(b=>b.classList.toggle('on', b.dataset.cam===kind));
}

// ---------- UI ----------
const vb = document.getElementById('viewBtns');
const allBtn = document.createElement('button'); allBtn.textContent='All floors'; allBtn.onclick=()=>setView(-1); vb.appendChild(allBtn);
floorRecs.forEach((r,i)=>{ const b=document.createElement('button'); b.textContent=SHORT[r.f.id]; b.title=r.f.name; b.style.borderLeft=`3px solid ${ACCENT[r.f.id]}`; b.onclick=()=>setView(i); vb.appendChild(b); });

function setView(i){
  view = i;
  [...vb.children].forEach((b,k)=>b.classList.toggle('on', k===i+1));
  layout(); camPreset(i===-1?'iso':'iso');
  const fi = document.getElementById('floorInfo');
  if(i===-1){ fi.style.display='none'; }
  else{
    const f = floorRecs[i].f;
    fi.style.display='block';
    document.getElementById('floorTag').textContent = f.name + ' · ' + f.tag;
    document.getElementById('goal').innerHTML = f.goal;
    const kl = document.getElementById('keylist'); kl.innerHTML='';
    f.keys.forEach((k,n)=>{ const li=document.createElement('li'); li.innerHTML=`<span class="dot" style="background:${CAT[k.c]}">${n+1}</span><span>${k.t.replace(/</g,'&lt;')}</span>`; li.onclick=()=>showInfo(i,n); kl.appendChild(li); });
  }
  hideInfo();
}
let selPin=null;
function showInfo(fi, ki){
  const r = floorRecs[fi], k = r.f.keys[ki];
  document.getElementById('infoFloor').textContent = r.f.name;
  document.getElementById('infoT').innerHTML = `<span class="dot" style="background:${CAT[k.c]}">${ki+1}</span>${k.t.replace(/</g,'&lt;')}`;
  document.getElementById('infoD').textContent = k.d;
  document.getElementById('info').style.display='block';
  if(selPin) selPin.classList.remove('sel');
  selPin = r.pins[ki]; selPin.classList.add('sel');
}
function hideInfo(){ document.getElementById('info').style.display='none'; if(selPin) selPin.classList.remove('sel'); selPin=null; }
document.getElementById('infoX').onclick = hideInfo;
document.getElementById('explode').oninput = ()=>{ layout(); controls.target.y = stackCenterY(); };
document.querySelectorAll('[data-cam]').forEach(b=> b.onclick=()=>camPreset(b.dataset.cam));
const vis = (key, prop)=> document.getElementById(key).onchange = e => floorRecs.forEach(r=>{ r.layers[prop].visible = e.target.checked; if(prop==='tallWalls') r.layers.lowWalls.visible = true; });
vis('tPins','pins'); vis('tZones','zones'); vis('tPaths','paths'); vis('tWalls','tallWalls'); vis('tPeople','people');
floorRecs.forEach(r=> r.layers.tallWalls.visible = false);
addEventListener('keydown', e=>{
  if(e.key==='0') setView(-1);
  const n = parseInt(e.key); if(n>=1 && n<=5) setView(n-1);
  if(e.key==='Escape') hideInfo();
});

// CSS2D labels only check their own visibility, so propagate parent visibility
const cssObjs = []; scene.traverse(o=>{ if(o.isCSS2DObject) cssObjs.push(o); });
function syncLabels(){
  cssObjs.forEach(o=>{
    let v = true, p = o.parent;
    while(p){ if(!p.visible){ v=false; break; } p = p.parent; }
    o.visible = v;
  });
}
// ---------- loop ----------
const clock = new THREE.Clock();
function tick(){
  const t = performance.now()/1000;
  if(document.getElementById('tAnim').checked){
    anim.sweeps.forEach(s=>{ const k = (Math.sin(t*0.9)+1)/2; const x = s.a + (s.b-s.a)*k; s.items.forEach(it=>it.position.x = x); });
    anim.cones.forEach(c=>{ c.mesh.material.opacity = c.base*(0.45+0.55*Math.max(0,Math.sin(t*c.speed))); });
    anim.pulses.forEach(p=>{ if(p.spin) p.mesh.rotation.y = t*.6; });
    M.laserGlow.opacity = .16 + .1*Math.sin(t*6);
  }
  const dt = Math.min(clock.getDelta(), .1);
  if(camAnim>0){
    const k = 1 - Math.pow(0.0015, dt);
    camera.position.lerp(targetPos, k); controls.target.lerp(targetLook, k);
    camAnim += dt;
    if(camera.position.distanceTo(targetPos)<.02 || camAnim>2.2){ camera.position.copy(targetPos); controls.target.copy(targetLook); camAnim=0; }
  }
  controls.update();
  syncLabels();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight); });
controls.addEventListener('start', ()=>{ camAnim=0; document.querySelectorAll('[data-cam]').forEach(b=>b.classList.remove('on')); });

layout();
setView(-1);
camera.position.copy(targetPos); controls.target.copy(targetLook);
tick();
</script>
</body>
